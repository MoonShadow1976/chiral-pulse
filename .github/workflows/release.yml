# Release: on a v*.*.* tag, build the client bundle and publish to npm.
name: release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger: tags created via the REST API do not fire `push` events,
  # so a network-blocked `git push` can still release through a dispatch.
  workflow_dispatch: {}

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # tsdown is fetched by npx on the fly — `npm install tsdown` would
      # resolve the whole dependency tree, and the workspace-scoped
      # @deepseek-ai devDependencies (type-check references) use the
      # pnpm-only `workspace:` protocol, which npm cannot resolve.
      - name: Build client bundle
        run: npx --yes tsdown@0.22.2

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
