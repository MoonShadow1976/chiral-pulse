# Release: on a v*.*.* tag, build the client bundle and publish to npm.
name: release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger: tags created via the REST API do not fire `push` events,
  # so a network-blocked `git push` can still release through a dispatch.
  workflow_dispatch: {}

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # tsdown must resolve from the project's node_modules (tsdown.config.ts
      # imports 'tsdown'), so install it for real. `npm install` would try to
      # resolve the whole dependency tree first — drop the workspace-scoped
      # @deepseek-ai devDependencies (type-check references, pnpm-only
      # `workspace:` protocol) from this job's copy of package.json first.
      - name: Build client bundle
        run: |
          npm pkg delete devDependencies
          npm install --no-save --no-audit --no-fund tsdown@0.22.2
          npx tsdown

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
